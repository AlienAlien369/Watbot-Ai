<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>watbotai — Pizza Bot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 20px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 32px 0 24px;
    }
    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(90deg, #e94560, #f5a623);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: #aaa; margin-top: 6px; font-size: 0.95rem; }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .card h2 {
      font-size: 1.1rem;
      color: #f5a623;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label { font-size: 0.85rem; color: #bbb; display: block; margin-bottom: 4px; }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }
    input[type="text"]:focus { border-color: #e94560; }

    input[type="file"] { cursor: pointer; padding: 8px; }
    input[type="file"]::file-selector-button {
      background: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      margin-right: 10px;
      font-size: 0.85rem;
    }

    button {
      background: linear-gradient(90deg, #e94560, #f5a623);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      width: 100%;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .result-box {
      margin-top: 14px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.88rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 48px;
      color: #d0d0d0;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .result-box.success { border-color: rgba(80, 200, 120, 0.4); color: #80e0a0; }
    .result-box.error   { border-color: rgba(233, 69, 96, 0.4);  color: #ff8080; }
    .result-box.loading { color: #f5a623; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

    .chat-messages {
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.55;
      max-width: 85%;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(90deg, #e94560cc, #f5a623cc);
      color: white;
    }
    .msg.bot {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input {
      flex: 1;
      margin-bottom: 0;
    }
    .chat-input-row button {
      width: auto;
      padding: 10px 18px;
      flex-shrink: 0;
    }

    .stripe-link a {
      color: #f5a623;
      text-decoration: none;
      font-weight: 600;
    }
    .stripe-link a:hover { text-decoration: underline; }

    footer {
      text-align: center;
      color: #555;
      font-size: 0.8rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍕 watbotai</h1>
      <p>Multi-tenant PDF chat · Pizza ordering bot POC</p>
    </header>

    <!-- Tenant config -->
    <div class="card">
      <h2>⚙️ Configuration</h2>
      <label for="tenantId">Tenant ID</label>
      <input type="text" id="tenantId" value="tenant_123" placeholder="e.g. tenant_123" />
    </div>

    <!-- Upload PDF -->
    <div class="card">
      <h2>📄 Upload PDF</h2>
      <label for="pdfFile">Select a PDF file</label>
      <input type="file" id="pdfFile" accept=".pdf" />
      <button id="uploadBtn" onclick="uploadPdf()">Upload PDF</button>
      <div id="uploadResult" class="result-box" style="display:none;"></div>
    </div>

    <!-- Chat -->
    <div class="card">
      <h2>💬 Chat with the Bot</h2>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="text" id="question" placeholder="Ask the pizza bot something…"
               value="I want a pepperoni pizza, please"
               onkeydown="if(event.key==='Enter') sendMessage()" />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <footer>watbotai POC · Powered by Groq + FastAPI · Deployed on Render + Vercel</footer>
  </div>

  <script>
    // ── Backend URL: set VITE_BACKEND_URL at build time, or falls back to localhost ──
    const BACKEND = (window.__BACKEND_URL__ || "BACKEND_URL_PLACEHOLDER").replace(/\/$/, "");

    function getTenant() {
      return document.getElementById("tenantId").value.trim() || "tenant_123";
    }

    // ── Upload PDF ──
    async function uploadPdf() {
      const fileInput = document.getElementById("pdfFile");
      const resultDiv = document.getElementById("uploadResult");
      const btn = document.getElementById("uploadBtn");

      if (!fileInput.files.length) {
        showResult(resultDiv, "⚠️ Please select a PDF file first.", "error");
        return;
      }

      const file = fileInput.files[0];
      showResult(resultDiv, "⏳ Uploading and processing…", "loading");
      btn.disabled = true;

      try {
        const formData = new FormData();
        formData.append("tenant_id", getTenant());
        formData.append("file", file);

        const res = await fetch(`${BACKEND}/upload`, { method: "POST", body: formData });
        const data = await res.json();

        if (res.ok) {
          showResult(resultDiv, `✅ Uploaded! Chunks stored: ${data.chunks_stored}`, "success");
        } else {
          showResult(resultDiv, `❌ Error: ${data.detail || JSON.stringify(data)}`, "error");
        }
      } catch (e) {
        showResult(resultDiv, `❌ Network error: ${e.message}`, "error");
      } finally {
        btn.disabled = false;
      }
    }

    // ── Chat ──
    async function sendMessage() {
      const input = document.getElementById("question");
      const q = input.value.trim();
      if (!q) return;

      addMessage(q, "user");
      input.value = "";
      document.getElementById("sendBtn").disabled = true;

      const thinkingId = addMessage("🤔 Thinking…", "bot");

      try {
        const res = await fetch(`${BACKEND}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tenant_id: getTenant(), question: q })
        });
        const data = await res.json();
        const answer = data.answer || JSON.stringify(data, null, 2);
        updateMessage(thinkingId, answer);
      } catch (e) {
        updateMessage(thinkingId, `❌ Error: ${e.message}`);
      } finally {
        document.getElementById("sendBtn").disabled = false;
        input.focus();
      }
    }

    // ── Helpers ──
    let msgCounter = 0;

    function addMessage(text, role) {
      const id = "msg-" + (++msgCounter);
      const container = document.getElementById("chatMessages");
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.id = id;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return id;
    }

    function updateMessage(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
      const container = document.getElementById("chatMessages");
      container.scrollTop = container.scrollHeight;
    }

    function showResult(div, msg, type) {
      div.style.display = "block";
      div.textContent = msg;
      div.className = `result-box ${type}`;
    }
  </script>
</body>
</html>
